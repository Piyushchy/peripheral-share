name: build

# Builds the Windows installer and Android APK on every push, and publishes both
# as downloadable GitHub Release assets when you push a tag like v1.0.0.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the logic tests
        working-directory: windows
        run: python test_bridge.py

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r windows/requirements-dev.txt
      - name: Build the exe
        working-directory: windows
        run: python -m PyInstaller --noconfirm --clean MouseShare.spec
      - name: Rename release asset
        shell: pwsh
        run: Copy-Item windows/dist/MouseShare.exe windows/dist/PeripheralShare-Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: PeripheralShare-Windows
          path: windows/dist/PeripheralShare-Windows.exe

  android-apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Build the debug APK
        working-directory: android
        run: gradle wrapper --gradle-version 8.7 && ./gradlew assembleDebug
      - name: Rename release asset
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/PeripheralShare-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PeripheralShare-Android
          path: android/app/build/outputs/apk/debug/PeripheralShare-Android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-exe, android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/PeripheralShare-Windows/PeripheralShare-Windows.exe
            artifacts/PeripheralShare-Android/PeripheralShare-Android.apk
          generate_release_notes: true
