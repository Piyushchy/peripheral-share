name: build

# Builds MouseShare.exe and the debug APK on every push, and attaches both to
# the GitHub Release when you push a tag like v1.0.0.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the logic tests
        working-directory: windows
        run: python test_bridge.py

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r windows/requirements-dev.txt
      - name: Build the exe
        working-directory: windows
        run: python -m PyInstaller --noconfirm --clean MouseShare.spec
      - uses: actions/upload-artifact@v4
        with:
          name: MouseShare-windows
          path: windows/dist/MouseShare.exe

  android-apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Build the debug APK
        working-directory: android
        run: gradle wrapper --gradle-version 8.7 && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MouseShare-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-exe, android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
